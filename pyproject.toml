[project]
name = "sudoku-py"
version = "0.1.0"
description = "Using ORTools to solve cryptic sudokus"
readme = "README.md"
requires-python = ">=3.14, <3.15"
dependencies = [
    "frozendict>=2.5.1",
    "more-itertools>=11.2.1",
    "ortools>=9.15.6755",
]

[project.scripts]
sudoku-py = "sudoku_py:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
